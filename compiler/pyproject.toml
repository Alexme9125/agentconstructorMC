[project]
name = "printcore-compiler"
version = "0.1.0"
description = "Compile PrintCore IR into Sponge schematics and print plans"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "agentconstructorMC" }]

[project.scripts]
printcore-compile = "printcore_compiler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["printcore_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
