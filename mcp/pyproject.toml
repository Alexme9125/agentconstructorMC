[project]
name = "printcore-mcp"
version = "0.1.0"
description = "MCP server and CLI for PrintCore"
requires-python = ">=3.11"

[project.scripts]
printcore = "printcore_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["printcore_mcp*"]
